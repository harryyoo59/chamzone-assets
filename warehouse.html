<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>아이콘 창고</title>
  <style>
    :root {
      --w: 390px;
      --icon: 88px;
      --bg: #f6f4f1;
      --card: #fff;
      --ink: #1a1a1a;
      --muted: #666;
      --line: #ddd;
      --pick: #1a5cff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #e8e6e3;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button {
      font: inherit;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
      margin: 0;
      color: inherit;
    }
    .phone {
      width: var(--w);
      max-width: 100%;
      min-height: 100vh;
      max-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 16px 16px 10px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 18px;
    }
    .sub {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .head-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }
    .head-row h1 { margin: 0; }
    .btn-refresh {
      flex-shrink: 0;
      padding: 10px 14px;
      min-height: 44px;
      border-radius: 10px;
      background: #1a5cff;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }
    .btn-refresh:active { opacity: 0.85; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tab {
      padding: 8px 10px;
      border-radius: 999px;
      background: #eee;
      font-size: 13px;
    }
    .tab.on {
      background: var(--ink);
      color: #fff;
    }
    main {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 12px 16px;
    }
    .hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      padding: 24px 8px;
      text-align: center;
    }
    /* 항목마다: 설명 칸(위) → 그림 칸(아래, 핸드폰 넣는 크기) · 옆으로 붙이지 않음 */
    .list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }
    .item {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      background: none;
      border: none;
      padding: 0;
    }
    .item.on .item-text {
      border-color: var(--pick);
      background: #f5f8ff;
    }
    .item.on .item-pic {
      border-color: var(--pick);
    }
    .item-text {
      width: 100%;
      box-sizing: border-box;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 12px 12px;
    }
    .item-title {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .item-title .code {
      font-size: 16px;
      font-weight: 800;
      color: var(--pick);
      white-space: nowrap;
    }
    .item-title .name {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      word-break: keep-all;
    }
    .item-title .mark {
      display: none;
      color: var(--pick);
      font-size: 14px;
      font-weight: 800;
    }
    .item.on .item-title .mark { display: inline; }
    .item-desc {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.45;
      word-break: keep-all;
    }
    .item-pic {
      width: 100%;
      box-sizing: border-box;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    /* 원본 픽셀 크기 그대로 — 작은 아이콘을 키워서 흐리게 만들지 않음.
       화면(약 390)보다 큰 것만 줄임(축소만, 확대 금지). */
    .item-pic img.phone-sq,
    .item-pic img.phone-wide {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: none;
      object-fit: contain;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    .item-pic .credit-phone {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: auto;
      max-width: 280px;
      padding: 8px 10px;
      border-radius: 10px;
      background: #f7f7f7;
    }
    .item-pic .credit-phone img.i {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .item-pic .credit-phone img.l {
      height: 28px;
      width: auto;
      max-width: 200px;
      object-fit: contain;
    }
    .item-pic .apps-phone {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 300px;
    }
    .item-pic .apps-phone .apps-mark {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .item-pic .apps-phone .apps-mark img.i {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .item-pic .apps-phone .apps-mark img.l {
      height: 24px;
      width: auto;
      max-width: 90px;
      object-fit: contain;
    }
    .item-pic .apps-phone .btn {
      flex: 1 1 auto;
      min-height: 40px;
      padding: 8px 10px;
      border-radius: 10px;
      background: #1a5cff;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      word-break: keep-all;
    }
    .bar {
      flex: 0 0 auto;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding: 12px 14px 18px;
    }
    .bar .t {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .bar .name {
      font-size: 15px;
      font-weight: 600;
      word-break: keep-all;
    }
    .bar .path {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      word-break: keep-all;
      -webkit-user-select: text;
      user-select: text;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="phone">
    <header>
      <div class="head-row">
        <h1>아이콘 창고</h1>
        <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
          <a href="/" style="padding:10px 12px;min-height:44px;display:inline-flex;align-items:center;border-radius:10px;background:#eee;font-size:14px;font-weight:700">회사 홈</a>
          <button type="button" class="btn-refresh" id="btnRefresh">새로고침</button>
        </div>
      </div>
      <p class="sub">번호로 고르세요. 예: 「삼02」·「회01」. 창은 그대로 둡니다.</p>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <main id="main"><p class="hint">위에서 칸을 고르세요</p></main>
    <div class="bar">
      <div class="t">선택한 그림</div>
      <div class="name" id="selName">아직 없음</div>
      <div class="path" id="selPath"></div>
    </div>
  </div>
  <script>
    // 클릭해도 페이지·창이 닫히거나 이동하지 않게 고정
    document.addEventListener("click", function (e) {
      var a = e.target.closest("a");
      if (a) {
        var href = a.getAttribute("href") || "";
        if (href === "/" || href.indexOf("index.html") !== -1) return;
        e.preventDefault();
      }
    }, true);
    document.addEventListener("submit", function (e) {
      e.preventDefault();
    }, true);

    document.getElementById("btnRefresh").addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var u = new URL(window.location.href);
      u.searchParams.set("r", String(Date.now()));
      window.location.replace(u.toString());
    });

    var SECTIONS = [
      {
        id: "company",

        items: [
          {
            code: "회01",
            name: "용 그림만",
            desc: "파란 용 마크만 있는 원본입니다. 앱 아이콘·배지·프로필처럼 글자 없이 상징만 넣을 때 씁니다.",

            path: "company/chamzone-icon.png"

            src: "apps/novel/favicon.ico",
            path: "apps/novel/favicon.ico"

            desc: "탭용 작은 아이콘을 PNG로 둔 것입니다. 아이콘(ico) 대신 PNG가 필요한 곳(일부 설정·미리보기)에 씁니다.",

          },
          {

      {

      {

    var tabs = document.getElementById("tabs");
    var main = document.getElementById("main");
    var selName = document.getElementById("selName");
    var selPath = document.getElementById("selPath");
    var current = null;
    var selectedPath = null;

    SECTIONS.forEach(function (sec) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tab";
      b.textContent = sec.title;
      b.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        showSection(sec.id);
      });
      tabs.appendChild(b);
      sec._btn = b;
    });

    function showSection(id) {
      current = id;
      SECTIONS.forEach(function (sec) {
        sec._btn.classList.toggle("on", sec.id === id);
      });
      var sec = SECTIONS.find(function (s) { return s.id === id; });
      main.innerHTML = "";
      if (!sec.items.length) {
        var p = document.createElement("p");
        p.className = "hint";
        p.textContent = "이 칸은 아직 비어 있습니다.";
        main.appendChild(p);
        return;
      }
      var list = document.createElement("div");
      list.className = "list";
      sec.items.forEach(function (item) {
        var itemEl = document.createElement("button");
        itemEl.type = "button";
        itemEl.className = "item";
        if (selectedPath === item.path) itemEl.classList.add("on");

        // A. 설명 칸 (글만)
        var text = document.createElement("div");
        text.className = "item-text";
        var title = document.createElement("div");
        title.className = "item-title";
        var codeEl = document.createElement("span");
        codeEl.className = "code";
        codeEl.textContent = item.code || "";
        var nameEl = document.createElement("span");
        nameEl.className = "name";
        nameEl.textContent = item.name || "";
        var mark = document.createElement("span");
        mark.className = "mark";
        mark.textContent = "✓";
        title.appendChild(codeEl);
        title.appendChild(nameEl);
        title.appendChild(mark);
        var descEl = document.createElement("div");
        descEl.className = "item-desc";
        descEl.textContent = item.desc || "";
        text.appendChild(title);
        text.appendChild(descEl);
        itemEl.appendChild(text);

        // B. 그림 칸 (설명과 분리 · 원본 픽셀 크기)
        var pic = document.createElement("div");
        pic.className = "item-pic";
        if (item.novelCredit) {
          var credit = document.createElement("div");
          credit.className = "credit-phone";
          var ci = document.createElement("img");
          ci.className = "i";
          ci.src = item.iconSrc;
          ci.alt = "";
          ci.draggable = false;
          var cl = document.createElement("img");
          cl.className = "l";
          cl.src = item.logoSrc;
          cl.alt = item.name || "";
          cl.draggable = false;
          credit.appendChild(ci);
          credit.appendChild(cl);
          pic.appendChild(credit);
        } else if (item.logoPlusApps) {
          var apps = document.createElement("div");
          apps.className = "apps-phone";
          var mk = document.createElement("div");
          mk.className = "apps-mark";
          var ai = document.createElement("img");
          ai.className = "i";
          ai.src = item.iconSrc;
          ai.alt = "";
          ai.draggable = false;
          var al = document.createElement("img");
          al.className = "l";
          al.src = item.logoSrc;
          al.alt = "";
          al.draggable = false;
          mk.appendChild(ai);
          mk.appendChild(al);
          var btn = document.createElement("span");
          btn.className = "btn";
          btn.textContent = item.buttonLabel || "개발자가 만든 다른앱 둘러보기";
          apps.appendChild(mk);
          apps.appendChild(btn);
          pic.appendChild(apps);
        } else {
          var img = document.createElement("img");
          img.src = item.src;
          img.alt = item.name || "";
          img.draggable = false;
          img.className = item.wide ? "phone-wide" : "phone-sq";
          // 브라우저가 원본 크기로 그리도록 width/height 속성도 맞춤(확대 방지)
          img.onload = function () {
            if (!img.naturalWidth) return;
            img.width = img.naturalWidth;
            img.height = img.naturalHeight;
          };
          pic.appendChild(img);
        }
        itemEl.appendChild(pic);

        itemEl.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          selectedPath = item.path;
          selName.textContent = (item.code || "") + " · " + (item.name || "");
          selPath.textContent = item.desc || "";
          showSection(current);
        });
        list.appendChild(itemEl);
      });
      main.appendChild(list);
    }

    // 시작 시 회사 칸 · 회01
    showSection("company");
    selectedPath = "company/chamzone-icon.png";
    selName.textContent = "회01 · 용 그림만";
    selPath.textContent = "회사 탭에서 「회01」이라고 부르면 됩니다.";
    showSection("company");
  </script>
</body>
</html>
