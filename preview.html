<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>아이콘 창고</title>
  <style>
    :root {
      --w: 390px;
      --icon: 88px;
      --bg: #f6f4f1;
      --card: #fff;
      --ink: #1a1a1a;
      --muted: #666;
      --line: #ddd;
      --pick: #1a5cff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #e8e6e3;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    a { color: inherit; text-decoration: none; }
    button {
      font: inherit;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
      margin: 0;
      color: inherit;
    }
    .phone {
      width: var(--w);
      max-width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 16px 10px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 18px;
    }
    .sub {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .head-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }
    .head-row h1 { margin: 0; }
    .btn-refresh {
      flex-shrink: 0;
      padding: 10px 14px;
      min-height: 44px;
      border-radius: 10px;
      background: #1a5cff;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }
    .btn-refresh:active { opacity: 0.85; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tab {
      padding: 8px 10px;
      border-radius: 999px;
      background: #eee;
      font-size: 13px;
    }
    .tab.on {
      background: var(--ink);
      color: #fff;
    }
    main {
      flex: 1;
      padding: 14px 14px 100px;
    }
    .hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      padding: 24px 8px;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .tile {
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 8px 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-height: 120px;
      position: relative;
    }
    .tile.on {
      border-color: var(--pick);
      box-shadow: 0 0 0 1px var(--pick);
    }
    .tile .check {
      display: none;
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 14px;
      color: var(--pick);
      font-weight: 700;
    }
    .tile.on .check { display: block; }
    .tile img.sq {
      width: var(--icon);
      height: var(--icon);
      object-fit: contain;
    }
    .tile img.wide {
      width: 100%;
      max-width: 320px;
      height: auto;
      max-height: 100px;
      object-fit: contain;
    }
    .tile.wide-tile {
      grid-column: 1 / -1;
      min-height: auto;
    }
    /* 소설가 ProjectNL credit와 동일 배치 — 그림은 복사본만, 크기 재가공 없음 */
    .novel-credit-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 300px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fff;
      box-sizing: border-box;
    }
    .novel-credit-icon {
      display: block;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .novel-credit-logo {
      display: block;
      flex: 1 1 auto;
      width: auto;
      max-width: calc(100% - 48px);
      height: 36px;
      object-fit: contain;
      object-position: left center;
    }
    .label {
      font-size: 11px;
      text-align: center;
      color: var(--muted);
      word-break: break-all;
      line-height: 1.3;
    }
    .bar {
      position: sticky;
      bottom: 0;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding: 12px 14px 18px;
      min-height: 72px;
    }
    .bar .t {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .bar .name {
      font-size: 15px;
      font-weight: 600;
      word-break: break-all;
    }
    .bar .path {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body>
  <div class="phone">
    <header>
      <div class="head-row">
        <h1>아이콘 창고</h1>
        <button type="button" class="btn-refresh" id="btnRefresh">새로고침</button>
      </div>
      <p class="sub">칸을 고른 뒤 그림을 누르세요. 창은 그대로 둡니다.</p>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <main id="main"><p class="hint">위에서 칸을 고르세요</p></main>
    <div class="bar">
      <div class="t">선택한 그림</div>
      <div class="name" id="selName">아직 없음</div>
      <div class="path" id="selPath"></div>
    </div>
  </div>
  <script>
    // 클릭해도 페이지·창이 닫히거나 이동하지 않게 고정
    document.addEventListener("click", function (e) {
      var a = e.target.closest("a");
      if (a) {
        e.preventDefault();
      }
    }, true);
    document.addEventListener("submit", function (e) {
      e.preventDefault();
    }, true);

    document.getElementById("btnRefresh").addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var u = new URL(window.location.href);
      u.searchParams.set("r", String(Date.now()));
      window.location.replace(u.toString());
    });

    var SECTIONS = [
      {
        id: "company",
        title: "회사",
        items: [
          {
            label: "소설가와 같은 회사 로고",
            path: "company/chamzone-icon.png + company/chamzone-logo.png",
            wide: true,
            novelCredit: true,
            iconSrc: "company/chamzone-icon.png",
            logoSrc: "company/chamzone-logo.png"
          },
          { label: "용 아이콘만 (복사본)", src: "company/chamzone-icon.png", path: "company/chamzone-icon.png" },
          { label: "회사명 글자만 (복사본)", src: "company/chamzone-logo.png", path: "company/chamzone-logo.png", wide: true }
        ]
      },
      {
        id: "novel",
        title: "소설",
        items: [
          { label: "favicon", src: "apps/novel/favicon.ico", path: "apps/novel/favicon.ico" },
          { label: "favicon-32", src: "apps/novel/favicon-32.png", path: "apps/novel/favicon-32.png" },
          { label: "apple-touch", src: "apps/novel/apple-touch-icon.png", path: "apps/novel/apple-touch-icon.png" },
          { label: "icon-192", src: "apps/novel/icon-192.png", path: "apps/novel/icon-192.png" },
          { label: "icon-512", src: "apps/novel/icon-512.png", path: "apps/novel/icon-512.png" }
        ]
      },
      {
        id: "health",
        title: "건강",
        items: [
          { label: "icon-180", src: "apps/health/icon-180.png", path: "apps/health/icon-180.png" },
          { label: "apple-touch", src: "apps/health/apple-touch-icon.png", path: "apps/health/apple-touch-icon.png" },
          { label: "icon-192", src: "apps/health/icon-192.png", path: "apps/health/icon-192.png" },
          { label: "icon-512", src: "apps/health/icon-512.png", path: "apps/health/icon-512.png" },
          { label: "maskable-512", src: "apps/health/icon-maskable-512.png", path: "apps/health/icon-maskable-512.png" }
        ]
      },
      {
        id: "tour",
        title: "투어",
        items: [
          { label: "favicon-180", src: "apps/tour/favicon-180.png", path: "apps/tour/favicon-180.png" },
          { label: "apple-touch", src: "apps/tour/apple-touch-icon.png", path: "apps/tour/apple-touch-icon.png" },
          { label: "icon-512", src: "apps/tour/icon-512.png", path: "apps/tour/icon-512.png" }
        ]
      },
      {
        id: "emoji",
        title: "이모지",
        items: [
          { label: "cheer-heart.gif", src: "emoji/cheer-heart.gif", path: "emoji/cheer-heart.gif" },
          { label: "cheer-heart.webp", src: "emoji/cheer-heart.webp", path: "emoji/cheer-heart.webp" }
        ]
      },
      {
        id: "originals",
        title: "원본",
        items: []
      }
    ];

    var tabs = document.getElementById("tabs");
    var main = document.getElementById("main");
    var selName = document.getElementById("selName");
    var selPath = document.getElementById("selPath");
    var current = null;
    var selectedPath = null;

    SECTIONS.forEach(function (sec) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tab";
      b.textContent = sec.title;
      b.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        showSection(sec.id);
      });
      tabs.appendChild(b);
      sec._btn = b;
    });

    function showSection(id) {
      current = id;
      SECTIONS.forEach(function (sec) {
        sec._btn.classList.toggle("on", sec.id === id);
      });
      var sec = SECTIONS.find(function (s) { return s.id === id; });
      main.innerHTML = "";
      if (!sec.items.length) {
        var p = document.createElement("p");
        p.className = "hint";
        p.textContent = "이 칸은 아직 비어 있습니다.";
        main.appendChild(p);
        return;
      }
      var grid = document.createElement("div");
      grid.className = "grid";
      sec.items.forEach(function (item) {
        var tile = document.createElement("button");
        tile.type = "button";
        tile.className = "tile" + (item.wide ? " wide-tile" : "");
        if (selectedPath === item.path) tile.classList.add("on");

        var check = document.createElement("span");
        check.className = "check";
        check.textContent = "✓";

        tile.appendChild(check);
        if (item.novelCredit) {
          var row = document.createElement("div");
          row.className = "novel-credit-row";
          var icon = document.createElement("img");
          icon.className = "novel-credit-icon";
          icon.src = item.iconSrc;
          icon.alt = "";
          icon.width = 40;
          icon.height = 40;
          icon.draggable = false;
          var logo = document.createElement("img");
          logo.className = "novel-credit-logo";
          logo.src = item.logoSrc;
          logo.alt = item.label;
          logo.width = 200;
          logo.height = 36;
          logo.draggable = false;
          row.appendChild(icon);
          row.appendChild(logo);
          tile.appendChild(row);
        } else {
          var img = document.createElement("img");
          img.src = item.src;
          img.alt = item.label;
          img.className = item.wide ? "wide" : "sq";
          img.draggable = false;
          tile.appendChild(img);
        }

        var lab = document.createElement("div");
        lab.className = "label";
        lab.textContent = item.label;
        tile.appendChild(lab);
        tile.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          selectedPath = item.path;
          selName.textContent = item.label;
          selPath.textContent = item.path;
          showSection(current);
        });
        grid.appendChild(tile);
      });
      main.appendChild(grid);
    }

    // 시작 시 회사 칸 · 소설가 복사본 로고
    showSection("company");
    selectedPath = "company/chamzone-icon.png + company/chamzone-logo.png";
    selName.textContent = "소설가와 같은 회사 로고";
    selPath.textContent = "company/chamzone-icon.png + company/chamzone-logo.png (소설가 원본 복사)";
    showSection("company");
  </script>
</body>
</html>
